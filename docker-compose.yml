version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perfpilot-backend
    ports:
      - "8080:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///./perfpilot.db
      - LITELLM_MODEL=${LITELLM_MODEL:-gpt-4o}
      - MOCK_LLM=${MOCK_LLM:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - perfpilot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: perfpilot-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - perfpilot-net

networks:
  perfpilot-net:
    driver: bridge
